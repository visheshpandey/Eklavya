# Render blueprint for the backend (the frontend stays on Vercel). In Render: New > Blueprint > pick this repo.
# Free plan: no persistent disk, so the SQLite database (accounts, notes, progress) is wiped on every deploy and whenever
# the free service sleeps after ~15 minutes idle (the first request after that takes ~1 minute to wake it).
# For data that survives, change plan to starter and add:
#   disk: { name: eklavya-data, mountPath: /var/data, sizeGB: 1 }   and   DB_PATH=/var/data/eklavya.db
services:
  - type: web
    name: eklavya-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false            # paste your key in the Render dashboard; it never goes in the repo
      - key: AUTH_SECRET
        generateValue: true    # signs login tokens; Render creates a random value once
      - key: CORS_ORIGINS
        value: https://eklavya-lime.vercel.app
