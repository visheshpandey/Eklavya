# Keeps the free Render backend awake ONLY while the project is being judged, so a visitor never waits for a cold start and the
# free monthly instance hours (about 750) are not used up the rest of the time. It runs every 10 minutes but does nothing outside
# the window below (2 to 6 December 2026). "Run workflow" by hand always pings, for a test.
# The address is public (the same one in frontend/config.js), so no secret is needed.
name: Keep the backend awake while judging

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

env:
  WINDOW_FROM: "2026-12-02"
  WINDOW_TO: "2026-12-06"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health inside the window
        run: |
          today=$(date -u +%Y-%m-%d)
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] && { [[ "$today" < "$WINDOW_FROM" ]] || [[ "$today" > "$WINDOW_TO" ]]; }; then
            echo "Outside the judging window ($WINDOW_FROM to $WINDOW_TO): leaving the server to sleep."
            exit 0
          fi
          curl --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "https://eklavya-api-1bhf.onrender.com/api/health" > /dev/null
