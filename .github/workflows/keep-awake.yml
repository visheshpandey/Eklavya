# Keep-awake is OFF for now (no schedule), so nothing pings the free Render backend and its monthly instance hours are not used.
# To turn it on for judging (2 to 6 December 2026): remove the leading "#" from the three "schedule" lines below and push.
# "Run workflow" on the Actions tab still pings once by hand, for a test.
# The address is public (the same one in frontend/config.js), so no secret is needed.
name: Keep the backend awake while judging

on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: curl --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors --max-time 90 "https://eklavya-api-1bhf.onrender.com/api/health" > /dev/null
